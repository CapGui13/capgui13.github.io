name: Construire Bridge DD
on:
  push:
    branches: [main]
    paths:
      - "BridgeDD-source/**"
      - ".github/workflows/bridge-dd.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Télécharger DDS Web et construire Bridge DD
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --branch develop https://github.com/dds-bridge/dds.git /tmp/bridge-dds
          mkdir -p BridgeDD
          for f in dds_web.html dds_web.css dds_web.js dds_web_core.js dds_web_deal_import.js dds_web_play.js dds_web_sample_deals.js dds_web_solve.js coi-serviceworker.js; do
            cp "/tmp/bridge-dds/web/$f" "BridgeDD/$f"
          done
          for f in dds_web_wasm.js dds_web_wasm_bin.js; do
            curl --fail --location --retry 3 --silent --show-error "https://dds-bridge.github.io/dds/$f" -o "BridgeDD/$f"
            test -s "BridgeDD/$f"
          done
          cp BridgeDD-source/coach.js BridgeDD-source/coach.css BridgeDD-source/classic.css BridgeDD-source/classic.js BridgeDD-source/ffb_parse.js BridgeDD-source/ffb_fast.js BridgeDD-source/ffb_import.js BridgeDD-source/ffb_import.css BridgeDD-source/coach_rules.js BridgeDD-source/manifest.webmanifest BridgeDD-source/icon.svg BridgeDD/
          # Motorisation OCR FFB entièrement hébergée par le même site.
          npm install --prefix /tmp/bridge-ocr --no-audit --no-fund --no-save --silent tesseract.js@5.1.1 tesseract.js-core@5.0.0
          mkdir -p BridgeDD/ocr/core BridgeDD/ocr/lang
          cp /tmp/bridge-ocr/node_modules/tesseract.js/dist/tesseract.min.js BridgeDD/ocr/
          cp /tmp/bridge-ocr/node_modules/tesseract.js/dist/worker.min.js BridgeDD/ocr/
          cp /tmp/bridge-ocr/node_modules/tesseract.js-core/tesseract-core*.wasm* BridgeDD/ocr/core/
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata -o BridgeDD/ocr/lang/eng.traineddata
          gzip -f -9 -n BridgeDD/ocr/lang/eng.traineddata
          cp /tmp/bridge-ocr/node_modules/tesseract.js/LICENSE.md BridgeDD/ocr/TESSERACT_JS_LICENSE.md
          cp /tmp/bridge-dds/LICENSE BridgeDD/DDS_LICENSE.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path("BridgeDD/dds_web.html")
          html=p.read_text()
          assert '<html lang="en">' in html
          assert '</head>' in html and '</body>' in html
          html=html.replace('<html lang="en">','<html lang="fr">')
          html=html.replace('<title>DDS Web — Double Dummy Solver</title>', '<title>Bridge DD · Jeu interactif</title>')
          html=html.replace('</head>','<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<meta name="theme-color" content="#304a94">\n<link rel="manifest" href="manifest.webmanifest">\n<link rel="stylesheet" href="coach.css?v=wizard-v17b">\n<link rel="stylesheet" href="classic.css?v=geometry-v18">\n<link rel="stylesheet" href="ffb_import.css?v=ffb-v3">\n</head>')
          html=html.replace('</body>','<script src="coach_rules.js?v=optimal-v14"></script>\n<script src="coach.js?v=wizard-v17b"></script>\n<script src="classic.js?v=geometry-v18"></script>\n<script src="ffb_parse.js?v=ffb-v3"></script>\n<script src="ffb_fast.js?v=ffb-v3"></script>\n<script src="ffb_import.js?v=wizard-v17"></script>\n\n</body>')
          Path("BridgeDD/index.html").write_text(html)
          PY
          node --check BridgeDD/coach.js
          node BridgeDD-source/wizard_test.cjs
          node --check BridgeDD/classic.js
          node --test BridgeDD-source/layout_test.cjs
          node --check BridgeDD/ffb_parse.js
          node --check BridgeDD/ffb_fast.js
          node --check BridgeDD/ffb_import.js
          node --test BridgeDD-source/ffb_test.cjs
          grep -q 'classic.css' BridgeDD/index.html
          grep -q 'ffb_import.js' BridgeDD/index.html
          grep -q 'ffb_fast.js' BridgeDD/index.html
          test -s BridgeDD/ocr/lang/eng.traineddata.gz
          test -s BridgeDD/ocr/tesseract.min.js
          rm -f BridgeDD/coach_keyboard.js
          node --check BridgeDD/coach_rules.js
          node --test BridgeDD-source/coach_color_test.cjs
          node --check BridgeDD/dds_web_play.js
          ! grep -q "coach_keyboard.js" BridgeDD/index.html
          test -s BridgeDD/index.html
          test -s BridgeDD/dds_web_wasm_bin.js
          node - <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          vm.runInThisContext(fs.readFileSync('BridgeDD/dds_web_wasm_bin.js', 'utf8'));
          const bin = globalThis.ddsWebWasmBytes();
          fs.writeFileSync('/tmp/bridge-dd.wasm', Buffer.from(bin));
          JS
          node /tmp/bridge-dds/web/tests/dds_web_wasm_node.mjs "$PWD/BridgeDD/dds_web_wasm.js" /tmp/bridge-dd.wasm
      - name: Publier uniquement le dossier BridgeDD
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A BridgeDD/
          if git diff --cached --quiet; then
            echo "Déjà à jour."
          else
            git commit -m "Build Bridge DD with official DDS Web WASM"
            git push origin HEAD:main
          fi
