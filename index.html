<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>capgui13 — projets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #eef0fb;
    --muted: #a6acc9;
    --glass: rgba(255,255,255,0.06);
    --glass-line: rgba(255,255,255,0.12);
    --primary: #7c8cf0;
    --teal: #2dd4bf;
    --coral: #ff8a65;
    --focus: #2dd4bf;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100%;
    background: #0b0c16;
    color: var(--ink);
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    padding: 48px 20px;
    line-height:1.5;
    position:relative;
    overflow-x:hidden;
  }

  /* --- animated gradient mesh background --- */
  .blob{
    position:fixed;
    border-radius:50%;
    filter: blur(90px);
    opacity:0.55;
    z-index:0;
    pointer-events:none;
  }
  .blob.b1{
    width:480px; height:480px;
    background: radial-gradient(circle at 30% 30%, #4c5fd5, transparent 70%);
    top:-160px; left:-140px;
    animation: drift1 18s ease-in-out infinite;
  }
  .blob.b2{
    width:420px; height:420px;
    background: radial-gradient(circle at 30% 30%, #2dd4bf, transparent 70%);
    bottom:-160px; right:-120px;
    animation: drift2 22s ease-in-out infinite;
  }
  .blob.b3{
    width:360px; height:360px;
    background: radial-gradient(circle at 30% 30%, #ff8a65, transparent 70%);
    top:40%; right:10%;
    opacity:0.35;
    animation: drift3 26s ease-in-out infinite;
  }
  @keyframes drift1{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(60px, 40px) scale(1.1); }
  }
  @keyframes drift2{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-50px, -30px) scale(1.08); }
  }
  @keyframes drift3{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-40px, 50px) scale(0.95); }
  }

  .wrap{
    max-width: 620px;
    margin: 0 auto;
    position:relative;
    z-index:1;
  }

  /* --- header --- */
  header{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom: 36px;
    opacity:0;
    animation: rise 0.6s ease forwards;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  .avatar{
    width:56px; height:56px; border-radius:16px;
    background: linear-gradient(135deg, var(--primary), var(--teal));
    color:#0b0c16;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700; font-size:18px;
    flex:0 0 auto;
    box-shadow: 0 12px 30px -8px rgba(124,140,240,0.55);
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-size: 26px;
    margin: 0 0 4px;
    font-weight:700;
    letter-spacing:-0.01em;
    background: linear-gradient(120deg, #fff, var(--primary) 60%, var(--teal));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header p{
    margin:0; color:var(--muted); font-size:14.5px;
  }

  .section-label{
    font-size:12.5px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--muted);
    margin: 0 0 14px 4px;
    opacity:0;
    animation: rise 0.6s ease forwards;
    animation-delay: 0.1s;
  }

  /* --- glass list --- */
  .list{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom: 40px;
  }

  .row{
    --accent: var(--primary);
    position:relative;
    background: var(--glass);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border:1px solid var(--glass-line);
    border-radius:18px;
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:14px;
    isolation:isolate;
    box-shadow: 0 1px 1px rgba(255,255,255,0.04) inset, 0 20px 40px -28px rgba(0,0,0,0.6);
    transition: transform 0.2s cubic-bezier(.2,.8,.2,1), box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    opacity:0;
    animation: rise 0.5s ease forwards;
  }
  .row:hover{
    transform: translateY(-3px);
    background: rgba(255,255,255,0.09);
    border-color: rgba(255,255,255,0.3);
    box-shadow: 0 24px 48px -24px var(--accent), 0 0 24px -8px var(--accent);
  }
  .row:focus-within{
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .badge{
    flex:0 0 auto;
    padding:10px 16px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700; font-size:14px;
    letter-spacing:0.01em;
    white-space:nowrap;
    color:#0b0c16;
    box-shadow: 0 8px 18px -6px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.15) inset;
    transition: box-shadow 0.2s ease;
  }
  .row:hover .badge{
    box-shadow: 0 8px 18px -6px rgba(0,0,0,0.4), 0 0 20px -2px var(--accent), 0 0 0 1px rgba(255,255,255,0.25) inset;
  }

  .row-text{
    flex:1 1 auto;
    min-width:0;
    display:flex;
    align-items:center;
  }
  .row-desc{
    font-size:13.5px;
    color: var(--muted);
    margin:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .skeleton{
    display:inline-block; width:70%; height:11px; border-radius:4px;
    background: linear-gradient(90deg, rgba(255,255,255,0.06) 25%, rgba(255,255,255,0.14) 37%, rgba(255,255,255,0.06) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
  }
  @keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }

  .launch{
    flex:0 0 auto;
    width:38px; height:38px;
    clip-path: polygon(25% 6%, 75% 6%, 100% 50%, 75% 94%, 25% 94%, 0% 50%);
    background: rgba(255,255,255,0.07);
    display:flex; align-items:center; justify-content:center;
    color: var(--muted);
    transition: background 0.25s ease, color 0.25s ease, filter 0.25s ease, transform 0.25s ease;
  }
  .launch svg{ transition: transform 0.25s ease; }
  .row:hover .launch{
    background: linear-gradient(135deg, var(--accent), rgba(255,255,255,0.25));
    color: #0b0c16;
    filter: drop-shadow(0 0 10px var(--accent));
    transform: scale(1.06);
  }
  .row:hover .launch svg{
    transform: translate(1px,-1px);
  }

  a.row-hitbox{
    position:absolute; inset:0; border-radius:18px;
  }

  /* --- footer --- */
  footer{
    text-align:center;
    padding-top: 4px;
    opacity:0;
    animation: rise 0.6s ease forwards;
    animation-delay: 0.7s;
  }
  footer a{
    display:inline-flex; align-items:center; gap:8px;
    color: var(--ink);
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    background: var(--glass);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border:1px solid var(--glass-line);
    padding:11px 20px;
    border-radius:999px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
  }
  footer a:hover, footer a:focus-visible{
    border-color: rgba(124,140,240,0.5);
    box-shadow: 0 10px 26px -10px rgba(124,140,240,0.5);
    transform: translateY(-1px);
    outline:none;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; transition:none !important; }
    .blob{ animation:none !important; }
  }
</style>
</head>
<body>

  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="wrap">

    <p class="section-label">Projets en ligne</p>

    <div class="list" id="repo-list">
      <div class="row" data-repo="RR" style="--accent:#7c8cf0; animation-delay:0.15s;">
        <div class="badge" style="background:linear-gradient(135deg,#7c8cf0,#4c5fd5)">RR</div>
        <div class="row-text">
          <p class="row-desc"><span class="skeleton"></span></p>
        </div>
        <span class="launch"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg></span>
        <a class="row-hitbox" href="https://capgui13.github.io/RR/" target="_blank" rel="noopener" aria-label="Ouvrir le projet RR"></a>
      </div>

      <div class="row" data-repo="QPJB" style="--accent:#ff8a65; animation-delay:0.22s;">
        <div class="badge" style="background:linear-gradient(135deg,#ffab8a,#ff8a65)">QPJB</div>
        <div class="row-text">
          <p class="row-desc"><span class="skeleton"></span></p>
        </div>
        <span class="launch"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg></span>
        <a class="row-hitbox" href="https://capgui13.github.io/QPJB/" target="_blank" rel="noopener" aria-label="Ouvrir le projet QPJB"></a>
      </div>

      <div class="row" data-repo="QPJB13" style="--accent:#2dd4bf; animation-delay:0.29s;">
        <div class="badge" style="background:linear-gradient(135deg,#5eead4,#2dd4bf)">QPJB13</div>
        <div class="row-text">
          <p class="row-desc"><span class="skeleton"></span></p>
        </div>
        <span class="launch"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg></span>
        <a class="row-hitbox" href="https://capgui13.github.io/QPJB13/" target="_blank" rel="noopener" aria-label="Ouvrir le projet QPJB13"></a>
      </div>

      <div class="row" data-repo="gen" style="--accent:#d5744c; animation-delay:0.36s;">
        <div class="badge" style="background:linear-gradient(135deg,#f0b48c,#d5744c)">gen</div>
        <div class="row-text">
          <p class="row-desc"><span class="skeleton"></span></p>
        </div>
        <span class="launch"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg></span>
        <a class="row-hitbox" href="https://capgui13.github.io/gen/" target="_blank" rel="noopener" aria-label="Ouvrir le projet gen"></a>
      </div>

      <div class="row" data-repo="play" style="--accent:#9d5cd5; animation-delay:0.43s;">
        <div class="badge" style="background:linear-gradient(135deg,#c79bf5,#9d5cd5)">play</div>
        <div class="row-text">
          <p class="row-desc"><span class="skeleton"></span></p>
        </div>
        <span class="launch"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg></span>
        <a class="row-hitbox" href="https://capgui13.github.io/play/" target="_blank" rel="noopener" aria-label="Ouvrir le projet play"></a>
      </div>
    </div>

  </div>

<script>
// Récupère la description publique de chaque repo via l'API GitHub
// (best effort : si l'API est indisponible ou en rate-limit, on affiche
// un texte de repli plutôt que de laisser un vide)
document.querySelectorAll('.row[data-repo]').forEach(async row => {
  const repo = row.getAttribute('data-repo');
  const desc = row.querySelector('.row-desc');
  try{
    const res = await fetch(`https://api.github.com/repos/capgui13/${repo}`);
    if(!res.ok) throw new Error('no data');
    const data = await res.json();
    desc.textContent = data.description ? data.description : '';
  }catch(e){
    desc.textContent = '';
  }
});
</script>

</body>
</html>
