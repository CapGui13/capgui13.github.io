<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0b14">
<title>capgui13 — projets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b14;
    --ink:#f4f5fb;
    --muted:#a6acc3;
    --glass:rgba(255,255,255,.055);
    --glass-hover:rgba(255,255,255,.085);
    --line:rgba(255,255,255,.105);
    --line-hover:rgba(255,255,255,.22);
    --primary:#8390f7;
    --teal:#33d6c0;
    --coral:#ff936f;
    --radius:20px;
  }

  *{box-sizing:border-box}
  html{min-height:100%;background:var(--bg)}
  body{
    margin:0;
    min-height:100vh;
    color:var(--ink);
    font-family:'Inter',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:
      radial-gradient(900px 620px at -8% -10%, rgba(93,111,242,.22), transparent 62%),
      radial-gradient(780px 620px at 105% 96%, rgba(45,212,191,.16), transparent 60%),
      radial-gradient(620px 520px at 86% 42%, rgba(255,138,101,.09), transparent 64%),
      var(--bg);
    padding:clamp(34px,6vw,72px) 20px 44px;
    line-height:1.5;
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.22;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.05'/%3E%3C/svg%3E");
    mix-blend-mode:soft-light;
  }

  .wrap{
    width:min(100%,680px);
    margin:0 auto;
    position:relative;
    z-index:1;
  }

  .section-label{
    margin:0 0 14px 4px;
    color:var(--muted);
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    animation:rise .55s cubic-bezier(.2,.8,.2,1) both;
  }

  .list{
    display:grid;
    gap:12px;
  }

  .project{
    --accent:var(--primary);
    display:grid;
    grid-template-columns:auto minmax(0,1fr) auto;
    align-items:center;
    gap:15px;
    min-height:82px;
    padding:14px 15px;
    color:inherit;
    text-decoration:none;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.035));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.055),
      0 18px 44px -32px rgba(0,0,0,.95);
    backdrop-filter:blur(18px) saturate(120%);
    -webkit-backdrop-filter:blur(18px) saturate(120%);
    position:relative;
    overflow:hidden;
    isolation:isolate;
    opacity:0;
    transform:translateY(9px);
    animation:rise .48s cubic-bezier(.2,.8,.2,1) forwards;
    transition:transform .2s cubic-bezier(.2,.8,.2,1),border-color .2s ease,background .2s ease,box-shadow .2s ease;
  }

  .project::before{
    content:"";
    position:absolute;
    inset:0 auto 0 0;
    width:3px;
    background:linear-gradient(to bottom,transparent,var(--accent),transparent);
    opacity:.78;
  }

  .project::after{
    content:"";
    position:absolute;
    width:160px;height:160px;border-radius:50%;
    right:-95px;top:-90px;
    background:var(--accent);
    filter:blur(44px);
    opacity:.09;
    z-index:-1;
    transition:opacity .2s ease,transform .2s ease;
  }

  .project:hover{
    transform:translateY(-3px);
    border-color:var(--line-hover);
    background:linear-gradient(145deg,rgba(255,255,255,.095),rgba(255,255,255,.052));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.08),
      0 24px 54px -34px var(--accent);
  }

  .project:hover::after{opacity:.17;transform:scale(1.08)}
  .project:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  .badge{
    min-width:64px;
    height:48px;
    padding:0 14px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Grotesk',sans-serif;
    font-size:13.5px;
    line-height:1;
    letter-spacing:.01em;
    font-weight:700;
    color:#0a0b14;
    background:linear-gradient(135deg,var(--badge-a),var(--badge-b));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.28),
      0 10px 24px -15px var(--accent);
  }

  .copy{min-width:0}

  .desc{
    margin:0;
    min-height:19px;
    color:var(--muted);
    font-size:13.5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .desc.loading{
    width:min(78%,360px);
    height:10px;
    min-height:10px;
    border-radius:999px;
    background:linear-gradient(90deg,rgba(255,255,255,.055) 25%,rgba(255,255,255,.14) 38%,rgba(255,255,255,.055) 63%);
    background-size:360% 100%;
    animation:shimmer 1.35s ease infinite;
  }

  .launch{
    width:40px;height:40px;
    display:grid;
    place-items:center;
    border-radius:13px;
    color:#c2c7da;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.055);
    transition:transform .2s ease,color .2s ease,background .2s ease,border-color .2s ease;
  }

  .launch svg{transition:transform .2s ease}
  .project:hover .launch{
    color:#0a0b14;
    background:var(--accent);
    border-color:transparent;
    transform:scale(1.04);
  }
  .project:hover .launch svg{transform:translate(1px,-1px)}

  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}

  @media (max-width:520px){
    body{padding-left:14px;padding-right:14px}
    .project{min-height:76px;padding:12px;gap:12px;border-radius:17px}
    .badge{min-width:58px;height:44px;padding:0 11px;border-radius:12px;font-size:12.5px}
    .launch{width:36px;height:36px;border-radius:11px}
    .desc{font-size:12.5px}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important;scroll-behavior:auto!important}
  }
</style>
</head>
<body>
  <main class="wrap">
    <p class="section-label">Projets en ligne</p>

    <section class="list" aria-label="Liste des projets">
      <a class="project" data-repo="RR" data-description="Website du Roy René" href="https://capgui13.github.io/RR/" target="_blank" rel="noopener" style="--accent:#8390f7;--badge-a:#99a4ff;--badge-b:#5c6fe5;animation-delay:.08s" aria-label="Ouvrir le projet RR dans un nouvel onglet">
        <span class="badge">RR</span>
        <span class="copy"><span class="desc">Website du Roy René</span></span>
        <span class="launch" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
      </a>

      <a class="project" data-repo="QPJB13" data-description="Website du QPJB" href="https://capgui13.github.io/QPJB13/" target="_blank" rel="noopener" style="--accent:#2fc7b4;--badge-a:#67e2d3;--badge-b:#24ae9d;animation-delay:.14s" aria-label="Ouvrir le projet QPJB13 dans un nouvel onglet">
        <span class="badge">QPJB13</span>
        <span class="copy"><span class="desc">Website du QPJB</span></span>
        <span class="launch" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
      </a>

      <a class="project" data-repo="QPJB" data-description="App du QPJB" href="https://capgui13.github.io/QPJB/" target="_blank" rel="noopener" style="--accent:#1fa895;--badge-a:#4fd0be;--badge-b:#198a7b;animation-delay:.20s" aria-label="Ouvrir le projet QPJB dans un nouvel onglet">
        <span class="badge">QPJB</span>
        <span class="copy"><span class="desc">App du QPJB</span></span>
        <span class="launch" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
      </a>

      <a class="project" data-repo="PBN" data-description="PBN Downloader (FFB)" href="https://capgui13.github.io/PBN/" target="_blank" rel="noopener" style="--accent:#b27ae8;--badge-a:#d3a7f5;--badge-b:#9a5fd6;animation-delay:.26s" aria-label="Ouvrir le projet PBN dans un nouvel onglet">
        <span class="badge">PBN</span>
        <span class="copy"><span class="desc">PBN Downloader (FFB)</span></span>
        <span class="launch" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
      </a>

      <a class="project" data-repo="gen" href="https://capgui13.github.io/gen/" target="_blank" rel="noopener" style="--accent:#8f63dc;--badge-a:#b899ee;--badge-b:#7445c4;animation-delay:.32s" aria-label="Ouvrir le projet gen dans un nouvel onglet">
        <span class="badge">gen</span>
        <span class="copy"><span class="desc loading" aria-live="polite"></span></span>
        <span class="launch" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
      </a>

      <a class="project" data-repo="play" data-description="Rings" href="https://capgui13.github.io/play/" target="_blank" rel="noopener" style="--accent:#6f49c6;--badge-a:#9b7ae4;--badge-b:#5a35af;animation-delay:.38s" aria-label="Ouvrir le projet play dans un nouvel onglet">
        <span class="badge">play</span>
        <span class="copy"><span class="desc">Rings</span></span>
        <span class="launch" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
      </a>
    </section>
  </main>

<script>
(() => {
  const card = document.querySelector('.project[data-repo="gen"]');
  if (!card) return;

  const desc = card.querySelector('.desc');
  const CACHE_KEY = 'capgui13-gen-description-v3';
  const CACHE_TTL = 6 * 60 * 60 * 1000;

  const show = text => {
    desc.classList.remove('loading');
    desc.textContent = text || '';
  };

  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (_) {}

  if (cached && Date.now() - cached.time < CACHE_TTL) {
    show(cached.description);
    return;
  }

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 3500);

  fetch('https://api.github.com/repos/capgui13/gen', {
    headers: { 'Accept': 'application/vnd.github+json' },
    signal: controller.signal
  })
    .then(res => {
      if (!res.ok) throw new Error(`GitHub API: ${res.status}`);
      return res.json();
    })
    .then(data => {
      const description = (data.description || '').trim();
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ description, time: Date.now() })); } catch (_) {}
      show(description);
    })
    .catch(() => show(cached ? cached.description : ''))
    .finally(() => clearTimeout(timer));
})();
</script>
</body>
</html>
