<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>capgui13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0d12;
    --bg-glow: rgba(110,168,255,0.08);
    --line: #1c2230;
    --text: #d8dee9;
    --dim: #545f73;
    --accent: #7ee0c2;
    --amber: #d9b06e;
    --err: #ff6b6b;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(900px 500px at 20% 0%, var(--bg-glow), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }

  .term{
    width:100%; max-width:560px;
    background: #0d1117;
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    box-shadow: 0 30px 80px -30px rgba(0,0,0,0.6);
    animation: rise 0.5s ease both;
  }
  @keyframes rise{ from{ opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  .titlebar{
    display:flex; align-items:center; gap:8px;
    padding:11px 14px;
    background: #11151d;
    border-bottom:1px solid var(--line);
  }
  .dot{ width:10px; height:10px; border-radius:50%; }
  .dot.r{ background:#ff5f57; }
  .dot.y{ background:#febc2e; }
  .dot.g{ background:#28c840; }
  .titlebar span.label{
    margin-left:8px; font-size:12px; color:var(--dim);
  }

  .screen{ padding:20px 22px 24px; }

  .prompt{
    font-size:13px; color:var(--dim); margin-bottom:2px;
  }
  .prompt .who{ color: var(--accent); }
  .prompt .path{ color: var(--amber); }
  .cmd{
    font-size:13.5px; color:var(--text); margin:0 0 18px;
  }
  .cmd .flag{ color:var(--dim); }
  .cursor{
    display:inline-block; width:7px; height:14px; background:var(--accent);
    margin-left:2px; vertical-align:-2px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  ul.repos{ list-style:none; margin:0; padding:0; }
  ul.repos li{ margin:0; }

  a.entry{
    display:block;
    text-decoration:none; color:inherit;
    padding:9px 10px;
    margin:0 -10px;
    border-radius:6px;
    border-left:2px solid transparent;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  a.entry:hover{
    background: rgba(126,224,194,0.06);
    border-left-color: var(--accent);
  }

  .row{
    display:flex; align-items:baseline; gap:12px; font-size:13px;
  }
  .row .perm{ color:var(--dim); }
  .row .name{ color:var(--text); font-weight:700; font-size:14px; display:inline; }
  a.entry:hover .row .name{ color: var(--accent); }
  .row .arrow{ color:var(--dim); font-size:12px; }
  a.entry:hover .row .arrow{ color:var(--accent); }

  .desc{
    font-size:12px; color:var(--dim); margin:3px 0 0 0;
    padding-left:0;
    min-height:14px;
  }
  .desc .skeleton{
    display:inline-block; width:60%; height:10px; border-radius:3px;
    background: linear-gradient(90deg, #1a2029 25%, #232b38 37%, #1a2029 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
  }
  @keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }

  footer.bar{
    border-top:1px solid var(--line);
    margin-top:16px; padding-top:14px;
    font-size:12px; color:var(--dim);
    display:flex; justify-content:space-between; align-items:center;
  }
  footer.bar a{ color:var(--dim); text-decoration:none; border-bottom:1px dotted var(--dim); }
  footer.bar a:hover{ color:var(--accent); border-color:var(--accent); }
</style>
</head>
<body>

  <div class="term">
    <div class="titlebar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="label">capgui13 — repos</span>
    </div>
    <div class="screen">
      <div class="prompt"><span class="who">capgui13</span>@github:<span class="path">~</span></div>
      <p class="cmd">$ ls -la ./repos/<span class="cursor"></span></p>

      <ul class="repos" id="repo-list">
        <li>
          <a class="entry" href="https://capgui13.github.io/RR/" target="_blank" rel="noopener">
            <div class="row"><span class="perm">drwxr-xr-x</span><span class="name">RR</span><span class="arrow">→ pages</span></div>
            <p class="desc" data-repo="RR"><span class="skeleton"></span></p>
          </a>
        </li>
        <li>
          <a class="entry" href="https://capgui13.github.io/QPJB/" target="_blank" rel="noopener">
            <div class="row"><span class="perm">drwxr-xr-x</span><span class="name">QPJB</span><span class="arrow">→ pages</span></div>
            <p class="desc" data-repo="QPJB"><span class="skeleton"></span></p>
          </a>
        </li>
        <li>
          <a class="entry" href="https://capgui13.github.io/QPJB13/" target="_blank" rel="noopener">
            <div class="row"><span class="perm">drwxr-xr-x</span><span class="name">QPJB13</span><span class="arrow">→ pages</span></div>
            <p class="desc" data-repo="QPJB13"><span class="skeleton"></span></p>
          </a>
        </li>
        <li>
          <a class="entry" href="https://capgui13.github.io/gen/" target="_blank" rel="noopener">
            <div class="row"><span class="perm">drwxr-xr-x</span><span class="name">gen</span><span class="arrow">→ pages</span></div>
            <p class="desc" data-repo="gen"><span class="skeleton"></span></p>
          </a>
        </li>
        <li>
          <a class="entry" href="https://capgui13.github.io/play/" target="_blank" rel="noopener">
            <div class="row"><span class="perm">drwxr-xr-x</span><span class="name">play</span><span class="arrow">→ pages</span></div>
            <p class="desc" data-repo="play"><span class="skeleton"></span></p>
          </a>
        </li>
      </ul>

      <footer class="bar">
        <span id="repo-count">5 directories</span>
        <a href="https://github.com/capgui13" target="_blank" rel="noopener">github.com/capgui13</a>
      </footer>
    </div>
  </div>

<script>
// Récupère la description publique de chaque repo via l'API GitHub
// (best effort : si l'API est indisponible ou en rate-limit, la ligne
// reste simplement sans description, sans casser la page)
document.querySelectorAll('.desc[data-repo]').forEach(async el => {
  const repo = el.getAttribute('data-repo');
  try{
    const res = await fetch(`https://api.github.com/repos/capgui13/${repo}`);
    if(!res.ok) throw new Error('no data');
    const data = await res.json();
    el.textContent = data.description ? `# ${data.description}` : '# —';
  }catch(e){
    el.textContent = '';
  }
});
</script>

</body>
</html>
